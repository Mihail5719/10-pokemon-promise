<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Pokémon Ability — Promises</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Pokémon Ability</h1>

        <form id="form" class="form">
            <input type="text" id="pokemon-input" placeholder="Имя покемона (например: ditto)" value="ditto"
                autocomplete="off">
            <button type="submit">Загрузить</button>
        </form>

        <div id="card" class="card">
            <p class="loading">Введите имя покемона и нажмите «Загрузить»</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
